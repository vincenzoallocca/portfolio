<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Vincenzo Allocca</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050816">
<link rel="icon" href="/assets/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
/* Transizione morbida tra le pagine del sito (View Transitions tra documenti); i browser che non la supportano navigano come sempre */
@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
@font-face{font-family:'Mona Sans';font-weight:400 800;font-stretch:100% 125%;font-display:swap;src:url('/assets/fonts/mona-sans.woff2') format('woff2')}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#050816;color-scheme:dark}
body{
  min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;padding:1.5rem;color:#f4f7ff;text-align:center;
  font-family:"Mona Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(50rem 30rem at 50% -10%,rgba(76,110,255,.28),transparent 70%),#050816;
}
main{
  max-width:24rem;padding:2rem 1.5rem;border-radius:1.5rem;
  background:rgba(10,15,42,.6);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.55);
}
h1{
  font-size:4rem;line-height:1;margin-bottom:.75rem;letter-spacing:-.04em;font-weight:800;font-stretch:125%;color:#fff;
}
p{color:#b6c3e2;margin-bottom:1.5rem;font-size:.95rem;line-height:1.5}
a{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:2.75rem;padding:.6rem 1.25rem;border-radius:.9rem;
  color:#fff;font-size:.9rem;font-weight:600;text-decoration:none;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(135deg,rgba(140,194,255,.28),rgba(169,155,255,.2));
  transition:background .2s,border-color .2s,transform .2s;
}
a:hover{background:linear-gradient(135deg,rgba(140,194,255,.4),rgba(169,155,255,.32));border-color:rgba(255,255,255,.35)}
a:active{transform:scale(.98)}
a:focus-visible{outline:2px solid #8cc2ff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Questo indirizzo non porta a nessuna pagina. Controlla il link oppure torna alla home.</p>
  <a href="/">Torna alla home</a>
</main>
</body>
</html>
