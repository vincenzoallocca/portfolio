# Controlli di qualità SEO, HTML, link e Lighthouse.
# Non pubblica nulla: il deploy resta quello di GitHub Pages dal branch main.
# Errori bloccanti: seo-check, validazione HTML, soglie "error" di Lighthouse.
# Solo avvisi: freschezza della sitemap, link esterni, soglie "warn" di Lighthouse.
name: SEO quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # ogni lunedì: intercetta link esterni rotti nel tempo

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: SEO statico e HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # serve la cronologia git per calcolare il lastmod della sitemap
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Controlli SEO (metadata, canonical, H1, alt, JSON-LD, sitemap, robots, link interni)
        run: node scripts/seo-check.mjs
      - name: Validazione HTML
        run: npx --yes html-validate@11.21.1 --config .github/htmlvalidate.json index.html 404.html "progetti/**/*.html"
      - name: Sitemap aggiornata (avviso)
        continue-on-error: true
        run: |
          node scripts/seo-check.mjs --write-sitemap > /dev/null
          git diff --exit-code sitemap.xml || {
            echo "::warning file=sitemap.xml::sitemap.xml non aggiornata: esegui 'node scripts/seo-check.mjs --write-sitemap' e committa";
            exit 1;
          }

  links:
    name: Link esterni (avviso)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Instagram, Facebook e WhatsApp bloccano i client automatici: falsi positivi garantiti.
          # --root-dir: i link che iniziano con "/" (es. /assets/…, /progetti/haste/) vanno
          # risolti rispetto alla radice del repository, che corrisponde alla radice del sito.
          args: >-
            --no-progress
            --max-retries 2
            --root-dir '${{ github.workspace }}'
            --exclude 'instagram\.com|facebook\.com|wa\.me|^mailto:'
            --exclude-path 'docs|scripts'
            './**/*.html' llms.txt

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Lighthouse (3 run per URL, mobile)
        run: npx --yes @lhci/cli@0.16.1 autorun --config=.github/lighthouserc.json
      # Report scritti in una cartella non nascosta: upload-artifact (v4+) esclude
      # per impostazione predefinita i file e le cartelle che iniziano con ".".
      - name: Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report
          if-no-files-found: warn
          retention-days: 14
